name: Backend CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: backend-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

      - name: Set up Python 3.11
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        if: steps.filter.outputs.backend == 'true'
        run: |
          ruff check .

      - name: Run Tests with Coverage
        if: steps.filter.outputs.backend == 'true'
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Annotate Code Coverage
        uses: orgoro/coverage@v3.1
        if: steps.filter.outputs.backend == 'true'
        continue-on-error: true
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdModified: 0

      - name: Backend CI Skipped
        if: steps.filter.outputs.backend != 'true'
        run: echo "No backend files changed. Backend CI skipped successfully."
