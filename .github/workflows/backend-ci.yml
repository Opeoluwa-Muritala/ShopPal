name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: backend-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Enforce non-decreasing coverage floor
        id: coverage-floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m unittest discover -s ../scripts/tests -p test_coverage_floor.py
          python ../scripts/check_coverage_floor.py "$BASE_SHA"

      - name: Run Tests with Coverage
        env:
          PYTEST_ADDOPTS: ''
        run: |
          pytest tests -o addopts= --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=${{ steps.coverage-floor.outputs.floor }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('backend/coverage.xml') != '' }}
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
