name: Backend CI

on:
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: backend-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx pip-audit bandit
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Dependency Security Scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Static Security Scan (Bandit)
        run: bandit -r app -ll

      - name: Run Database Migrations
        run: |
          if [ -f alembic.ini ]; then
            if ! command -v alembic >/dev/null 2>&1; then
              echo "Error: alembic.ini found but Alembic CLI is not installed."
              exit 1
            fi
            alembic upgrade head
          else
            echo "Error: no alembic.ini found — cannot verify migrations."
            exit 1
          fi

      - name: Enforce non-decreasing coverage floor
        id: coverage-floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m unittest discover -s ../scripts/tests -p test_coverage_floor.py
          python ../scripts/check_coverage_floor.py "$BASE_SHA"

      - name: Run Tests with Coverage
        env:
          PYTEST_ADDOPTS: ''
        run: |
          pytest tests -o addopts= --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=${{ steps.coverage-floor.outputs.floor }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('backend/coverage.xml') != '' }}
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
