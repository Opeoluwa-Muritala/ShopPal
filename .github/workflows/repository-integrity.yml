name: Repository Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan before installing or running repository code
        run: python scripts/scan_repository_integrity.py
