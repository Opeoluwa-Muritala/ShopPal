name: Backend CI and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci-check:
    name: Verify Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx pip-audit bandit
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Dependency Security Scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Static Security Scan (Bandit)
        run: bandit -r app -ll

      - name: Run Database Migrations Against Ephemeral CI Postgres
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
        run: |
          if [ -f alembic.ini ]; then
            if ! command -v alembic >/dev/null 2>&1; then
              echo "Error: alembic.ini found but Alembic CLI is not installed."
              exit 1
            fi
            alembic upgrade head
          else
            echo "No alembic.ini found. Skipping migration step."
            exit 1
          fi

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=40

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-ci-check]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not configured."
            exit 1
          fi
          alembic upgrade head

      - name: Trigger Backend Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not configured."
            exit 1
          fi
          echo "Triggering backend deploy hook..."
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --get --data-urlencode "ref=$GITHUB_SHA" "$DEPLOY_HOOK"
