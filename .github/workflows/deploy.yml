name: Backend CI and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci-check:
    name: Verify Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-ci-check]
    steps:
      - name: Trigger Backend Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not configured."
            exit 1
          fi
          echo "Triggering backend deploy hook..."
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --get --data-urlencode "ref=$GITHUB_SHA" "$DEPLOY_HOOK"
