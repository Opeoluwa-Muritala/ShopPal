name: Deploy Pipeline

on:
  push:
    branches: [main]

jobs:
  backend-ci-check:
    name: Verify Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest

  frontend-ci-check:
    name: Verify Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Linter
        run: |
          npm run lint

      - name: Run Type Check
        run: |
          npm run type-check

      - name: Run Tests
        run: |
          npm run test

      - name: Run Build
        run: |
          npm run build

  deploy-backend:
    name: Deploy Backend (Render / Railway)
    runs-on: ubuntu-latest
    needs: [backend-ci-check]
    steps:
      - name: Trigger Backend Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not configured."
            exit 1
          fi
          echo "Triggering backend deploy hook..."
          curl -s -S -X POST "$DEPLOY_HOOK"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-ci-check]
    steps:
      - name: Trigger Frontend Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK secret is not configured."
            exit 1
          fi
          echo "Triggering frontend deploy hook..."
          curl -s -S -X POST "$DEPLOY_HOOK"
