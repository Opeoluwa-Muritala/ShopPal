name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-typecheck-test-build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Linter (ESLint)
        run: |
          npm run lint

      - name: Run Type Check (TypeScript)
        run: |
          npm run type-check

      - name: Run Tests with Coverage
        run: |
          npm run test:coverage

      - name: Annotate Code Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: frontend/coverage/coverage-summary.json
          json-final-path: frontend/coverage/coverage-final.json
        continue-on-error: true

      - name: Run Build (Next.js)
        run: |
          npm run build
